name: Build ANVI Garments APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Check Python and Java
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Java ====="
          java -version

          echo "===== Repository ====="
          pwd
          find . -maxdepth 3 -type f | sort

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python build tools
        run: |
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.37"

      - name: Validate Android project
        shell: bash
        run: |

          echo "========================================"
          echo "ANVI GARMENTS ANDROID PROJECT CHECK"
          echo "========================================"

          if [ ! -f "main.py" ]; then
            echo "::error::main.py is missing"
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "::error::buildozer.spec is missing"
            exit 1
          fi

          echo "main.py found"
          echo "buildozer.spec found"

          python -m py_compile main.py

          echo "Python syntax check: PASS"

      - name: Install Kivy
        run: |
          python -m pip install "kivy==2.3.1"

      - name: Show Buildozer configuration
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          P4A_RELEASE_KEYSTORE: ""
          P4A_RELEASE_KEYSTORE_PASSWD: ""
          P4A_RELEASE_KEYALIAS: ""
          P4A_RELEASE_KEYALIAS_PASSWD: ""

        run: |
          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |

          echo "===== APK CHECK ====="

          if [ ! -d "bin" ]; then
            echo "::error::bin directory was not created"
            exit 1
          fi

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated"
            exit 1
          fi

          find bin -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANVI-Garments-v8.9.18-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
